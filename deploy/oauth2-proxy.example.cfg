# Configuration sketch for a maintained OIDC proxy, not a deployed/verified identity provider.
# Inject OAUTH2_PROXY_CLIENT_SECRET and OAUTH2_PROXY_COOKIE_SECRET securely at runtime.
# Replace provider/issuer/client/redirect values with your own verified identity configuration.
provider = "oidc"
oidc_issuer_url = "https://identity.example.invalid"
client_id = "replace-with-your-client-id"
redirect_url = "https://forensics.example.invalid/oauth2/callback"
email_domains = ["example.invalid"]
upstreams = ["http://api:8000"]
http_address = "0.0.0.0:4180"
cookie_secure = true
cookie_httponly = true
cookie_samesite = "lax"
set_xauthrequest = true
# Strip incoming identity headers in the TLS ingress; forward the validated proxy user.
# Bind API only to the private proxy network. Configure FF_TRUSTED_PROXY_IPS and
# FF_AUTHORIZED_SUBJECT to exactly match the proxy's actual peer and user identifier.
