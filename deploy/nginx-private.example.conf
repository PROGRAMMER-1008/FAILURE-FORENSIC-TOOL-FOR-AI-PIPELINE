# Owner-configured reference only; TLS/OIDC integration has not been exercised.
# This nginx is the API's trusted peer. Never publish the API port directly.
server {
    listen 443 ssl;
    server_name forensics.example.invalid;
    ssl_certificate /run/tls/fullchain.pem;
    ssl_certificate_key /run/tls/privkey.pem;
    client_max_body_size 2m;

    location /oauth2/ {
        proxy_pass http://oauth2-proxy:4180;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Auth-Request-User "";
    }
    location = /oauth2/auth {
        internal;
        proxy_pass http://oauth2-proxy:4180;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URL https://$host$request_uri;
    }
    location / {
        auth_request /oauth2/auth;
        error_page 401 = /oauth2/sign_in;
        auth_request_set $validated_user $upstream_http_x_auth_request_user;
        proxy_set_header X-Auth-Request-User $validated_user;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://api:8000;
        proxy_buffering off;
        proxy_read_timeout 180s;
    }
}
