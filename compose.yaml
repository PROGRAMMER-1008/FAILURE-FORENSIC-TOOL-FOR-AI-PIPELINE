name: failure-forensics-v2
services:
  frontend:
    image: nginxinc/nginx-unprivileged:1.28-alpine
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8000:8080"
    depends_on:
      - api
  db:
    image: postgres:17.5-bookworm
    environment:
      POSTGRES_DB: forensics
      POSTGRES_USER: forensics
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U forensics -d forensics"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Local demo only: no published DB port. Private hosting must use managed secrets/auth.
  migrate:
    build: .
    environment:
      FF_DATABASE_URL: postgresql+psycopg://forensics@db/forensics
    depends_on:
      db:
        condition: service_healthy
    command: [python, -m, alembic, upgrade, head]
    profiles: [tools]
  api:
    build: .
    environment:
      FF_DATABASE_URL: postgresql+psycopg://forensics@db/forensics
      FF_PROVIDER: fake
      FF_MODE: local
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 30s
  worker:
    build: .
    environment:
      FF_DATABASE_URL: postgresql+psycopg://forensics@db/forensics
      FF_PROVIDER: fake
    command: [python, -m, ffv2.worker]
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 150s
volumes:
  postgres-data:
