name: Deterministic checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.5-bookworm
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: ff_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ff_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.16"
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run pytest
        env:
          FF_TEST_DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/ff_test
          FF_PG_TEST_CONTAINER: ${{ job.services.postgres.id }}
      - run: uv run python scripts/scan_secrets.py
      - run: uv run python -m ffv2.benchmark --output /tmp/synthetic-report
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
      - run: npm ci
        working-directory: frontend
      - run: npm run lint && npm run build && npm test
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t failure-forensics:ci .
      - run: |
          trap 'docker rm -f ff-smoke >/dev/null 2>&1 || true' EXIT
          docker run -d --name ff-smoke failure-forensics:ci
          docker exec ff-smoke python -m alembic upgrade head
          for i in $(seq 1 20); do
            if docker exec ff-smoke python -c "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:8000/health/ready',timeout=2).status == 200"; then
              exit 0
            fi
            sleep 1
          done
          docker logs ff-smoke
          exit 1
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.16"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
      - run: uv sync --frozen
      - run: npm ci && npm run build && npx playwright install --with-deps chromium
        working-directory: frontend
        env:
          PLAYWRIGHT_SKIP_BROWSER_GC: "1"
      - run: |
          uv run python -m alembic upgrade head
          uv run python -m uvicorn ffv2.api:app --host 127.0.0.1 --port 8000 --no-access-log &
          api_pid=$!
          uv run python -m ffv2.worker &
          worker_pid=$!
          openssl req -x509 -newkey rsa:2048 -nodes -keyout /tmp/ff-key.pem -out /tmp/ff-cert.pem -days 1 -subj '/CN=localhost' >/dev/null 2>&1
          export FF_MODE=hosted
          export FF_PUBLIC_ORIGIN=https://127.0.0.1:18443
          export FF_OWNER_PASSWORD_HASH="$(uv run python -c 'from ffv2.auth import password_hash; print(password_hash("test-only-hosted-browser-password"))')"
          uv run python -m uvicorn ffv2.api:app --host 127.0.0.1 --port 18443 --ssl-keyfile /tmp/ff-key.pem --ssl-certfile /tmp/ff-cert.pem --no-access-log &
          hosted_pid=$!
          export FF_HOSTED_BROWSER_URL=https://127.0.0.1:18443
          trap 'kill "$api_pid" "$worker_pid" "$hosted_pid"' EXIT
          for i in 1 2 3 4 5; do curl --fail http://127.0.0.1:8000/health/ready && break || sleep 1; done
          npm --prefix frontend run e2e
