# Free project deployment only. PostgreSQL expires after 30 days; export before expiry.
services:
  - type: web
    name: failure-forensics-project
    runtime: docker
    plan: free
    region: oregon
    dockerCommand: python -m ffv2.hosted project
    healthCheckPath: /health/ready
    autoDeployTrigger: "off"
    envVars:
      - key: FF_MODE
        value: public
      - key: FF_PROVIDER
        value: groq
      - key: FF_DATABASE_URL
        fromDatabase:
          name: failure-forensics-project-db
          property: connectionString
      - key: FF_PUBLIC_ORIGIN
        sync: false
      - key: FF_VISITOR_DAILY_SUBMISSIONS
        value: "3"
      - key: FF_PUBLIC_DAILY_SUBMISSIONS
        value: "20"
      - key: FF_GROQ_API_KEY
        sync: false
      - key: FF_PRODUCER_MODEL
        value: openai/gpt-oss-20b
      - key: FF_JUDGE_MODEL
        value: openai/gpt-oss-20b
      - key: FF_GROQ_DAILY_CALLS
        value: "100"
      - key: FF_GROQ_MAX_COMPLETION_TOKENS
        value: "4096"
      - key: FF_PARSER_MEMORY_MB
        value: "128"
databases:
  - name: failure-forensics-project-db
    plan: free
    region: oregon
    databaseName: forensics
    user: forensics
    ipAllowList: []
