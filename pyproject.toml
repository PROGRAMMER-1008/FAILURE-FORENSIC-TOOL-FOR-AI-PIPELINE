[project]
name = "failure-forensics"
version = "2.0.0.dev0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.143.3",
  "uvicorn==0.34.2",
  "pydantic==2.11.4",
  "pydantic-settings==2.9.1",
  "sqlalchemy==2.0.40",
  "alembic==1.15.2",
  "psycopg[binary]==3.2.9",
  "httpx==0.28.1",
  "ollama==0.4.8",
  "pypdf==6.21.1",
  "python-docx==1.1.2",
  "python-multipart==0.0.32",
  "opentelemetry-api==1.45.1",
  "opentelemetry-sdk==1.45.1",
  "starlette==1.3.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-socket==0.7.0",
    "ruff==0.11.9",
    "mypy==1.15.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--disable-socket"
markers = ["postgres: requires disposable PostgreSQL", "live: opt-in real provider"]

[tool.ruff]
target-version = "py312"
line-length = 100
include = ["ffv2/**/*.py", "tests/**/*.py", "scripts/**/*.py"]

[tool.mypy]
python_version = "3.12"
files = ["ffv2"]
check_untyped_defs = true
ignore_missing_imports = true
